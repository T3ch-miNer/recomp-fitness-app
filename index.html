<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#050709"/>
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f2ee"/>
  <meta name="description" content="Recomp: the private, offline-first fitness tracker that makes consistency feel good."/>
  <meta name="color-scheme" content="dark light"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <!-- Non-blocking premium fonts: Recomp still starts using system fonts while offline or on slow connections. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400..800&amp;display=swap" onload="this.onload=null;this.rel='stylesheet'"/>
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400..800&amp;display=swap"/></noscript>
  <style>html{background:#050709}@media(prefers-color-scheme:light){html{background:#f3f2ee}}body{margin:0}</style>
  <link rel="manifest" href="./manifest.webmanifest"/>
  <link rel="icon" href="./icon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="./styles.css?v=2.5.1-review"/>
  <link rel="stylesheet" href="./nutrition-v2.css?v=2.7-worker-access-compat"/>
  <link rel="stylesheet" href="./premium.css?v=2.5.1-review"/>
  <link rel="stylesheet" href="./meal-planner.css?v=2.5.1-review"/>
  <!-- Original mint/glass navigation is styled by styles.css and premium.css. -->
  <link rel="stylesheet" href="./first-run.css?v=2.5.3-dev-auth"/>
  <link rel="stylesheet" href="./exercise-demonstration.css?v=2.5.4"/>
  <link rel="stylesheet" href="./workout-polish.css?v=2.5.5"/>
  <link rel="stylesheet" href="./giant-sets.css?v=2.6"/>
  <link rel="stylesheet" href="./settings-layout.css?v=2.7-settings-hub"/>
  <!-- Self-contained Recomp Pulse boot style. Loaded before application modules. -->
  <link rel="stylesheet" href="./launch.css?v=1"/>
  <title>Recomp — Train. Fuel. Evolve.</title>
</head>
<body>
  <div id="app">
    <div class="boot" role="status" aria-label="Loading Recomp">
      <div class="boot-kicker" aria-hidden="true"><span class="boot-kicker-dot"></span>RECOMP / PERSONAL FITNESS</div>
      <div class="boot-middle">
        <div class="boot-orbit" aria-hidden="true">
          <div class="boot-sweep"></div>
          <div class="boot-mark">
            <svg viewBox="0 0 192 192" width="115" height="115" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
              <defs>
                <linearGradient id="boot-mint-gradient" x1="0" y1="0" x2="1" y2="1">
                  <stop stop-color="#6ef5c8"/>
                  <stop offset="1" stop-color="#bff56a"/>
                </linearGradient>
              </defs>
              <path class="boot-wave-ghost" d="M42 104h24l16-38 24 60 18-42 14 20h22"/>
              <path class="boot-wave" pathLength="260" d="M42 104h24l16-38 24 60 18-42 14 20h22"/>
              <circle cx="148" cy="58" r="8" fill="#bff56a"/>
            </svg>
          </div>
        </div>
        <div class="boot-word" aria-hidden="true">recomp<span>.</span></div>
        <div class="boot-subline" aria-hidden="true"><strong>TRAIN</strong> · FUEL · EVOLVE</div>
        <div class="boot-tags" aria-hidden="true"><span>MOVE</span><span>GROW</span><span>REPEAT</span></div>
      </div>
      <div class="boot-footer">
        <div class="boot-track" aria-hidden="true"></div>
        <div class="boot-status">GETTING YOUR SPACE READY</div>
        <div class="boot-caption" aria-hidden="true">Small wins stack. One day at a time.</div>
      </div>
      <noscript><p class="boot-noscript">Recomp needs JavaScript to open your workout journal.</p></noscript>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js?v=2.8.9-add-plan-fab"></script>
</body>
</html>
