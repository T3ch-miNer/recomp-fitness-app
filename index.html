<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#050709"/>
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f2ee"/>
  <meta name="description" content="Recomp: the private, offline-first fitness tracker that makes consistency feel good."/>
  <meta name="color-scheme" content="dark light"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <!-- Non-blocking premium fonts: Recomp still starts using system fonts while offline or on slow connections. -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400..800&amp;display=swap" onload="this.onload=null;this.rel='stylesheet'"/>
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400..800&amp;display=swap"/></noscript>
  <style>html{background:#050709}@media(prefers-color-scheme:light){html{background:#f3f2ee}}body{margin:0}
 /* Critical first paint: show the loading screen even before full CSS arrives. */
 #recomp-pulse{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:#050709;color:#f6faf8}
 @media(prefers-color-scheme:light){#recomp-pulse{background:#f3f2ee;color:#141f1b}}
 </style>
 <link rel="stylesheet" href="./recomp-boot.css?v=2.9-recomp-pulse"/>
  <link rel="manifest" href="./manifest.webmanifest"/>
  <link rel="icon" href="./icon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="./styles.css?v=2.5.1-review"/>
  <link rel="stylesheet" href="./nutrition-v2.css?v=2.7-worker-access-compat"/>
  <link rel="stylesheet" href="./premium.css?v=2.5.1-review"/>
  <link rel="stylesheet" href="./meal-planner.css?v=2.5.1-review"/>
  <!-- Original mint/glass navigation is styled by styles.css and premium.css. -->
  <link rel="stylesheet" href="./first-run.css?v=2.5.3-dev-auth"/>
  <link rel="stylesheet" href="./exercise-demonstration.css?v=2.5.4"/>
  <link rel="stylesheet" href="./workout-polish.css?v=2.5.5"/>
  <link rel="stylesheet" href="./giant-sets.css?v=2.6"/>
  <link rel="stylesheet" href="./workout-focus-flow.css?v=2.9.2"/>
  <link rel="stylesheet" href="./warmup.css?v=2.9.3-universal-warmup"/>
  <link rel="stylesheet" href="./history-shortcuts.css?v=2.9.4-history-shortcuts"/>
  <link rel="stylesheet" href="./settings-layout.css?v=2.7-settings-hub"/>
  <title>Recomp — Train. Fuel. Evolve.</title>
</head>
<body>
  <div id="app"></div>
  <div id="recomp-pulse" role="status" aria-label="Opening Recomp">
    <div class="rb-top"><span class="rb-top-dot" aria-hidden="true"></span>RECOMP / PERSONAL FITNESS</div>
    <div class="rb-main">
      <div class="rb-orbit" aria-hidden="true">
        <div class="rb-orbit-light"></div>
        <div class="rb-squircle">
          <svg class="rb-icon" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
            <defs><linearGradient id="rb-pulse-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#6ef5c8"/><stop offset="1" stop-color="#bff56a"/>
            </linearGradient></defs>
            <path class="rb-trace" d="M42 104h24l16-38 24 60 18-42 14 20h22"/>
            <path class="rb-wave" d="M42 104h24l16-38 24 60 18-42 14 20h22"/>
            <circle class="rb-dot" cx="148" cy="58" r="8"/>
          </svg>
        </div>
      </div>
      <div class="rb-wordmark" aria-hidden="true">recomp<b>.</b></div>
      <div class="rb-tagline"><span class="rb-accent">TRAIN</span> · FUEL · EVOLVE</div>
      <div class="rb-traindots" aria-hidden="true"><span>MOVE</span><span>GROW</span><span>REPEAT</span></div>
    </div>
    <div class="rb-foot">
      <div class="rb-progress" aria-hidden="true"></div>
      <div class="rb-progress-title">GETTING YOUR SPACE READY</div>
      <div class="rb-foot-copy">Small wins stack. One day at a time.</div>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js?v=2.9.4-history-shortcuts"></script>
</body>
</html>
