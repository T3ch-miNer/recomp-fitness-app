name: Recomp isolated preview safety
on:
  push:
    branches:
      - preview/v2.5.1-safe-demo-20261020
permissions:
  contents: read
jobs:
  verify-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify preview does not use permanent browser storage or cloud authentication
        run: node --test tests/preview-safety.test.mjs tests/first-run.test.mjs
      - name: Verify nutrition and UX regression tests still pass
        run: node --test tests/food-db.test.mjs tests/meal-planner-integration.test.mjs tests/health-ui-and-macros.test.mjs meal-planner.test.mjs
      - name: Check that external preview serves a standalone HTML page
        run: |
          url="https://raw.githack.com/${{ github.repository }}/${{ github.sha }}/index.html"
          for i in 1 2 3 4; do
            if curl --fail --silent --show-error --location --max-time 15 "$url" | grep -q "DEMO PREVIEW"; then
              echo "Preview HTML is reachable through the demo proxy"
              exit 0
            fi
            sleep 5
          done
          echo "Preview CDN could not be verified"
          exit 1
      - name: Check browser module syntax
        run: |
          for file in app.js cloud.js db.js first-run.js nutrition-v2.js food-db.js meal-planner.js recipe-estimates.js health-connect.js sw.js; do
            node --input-type=module --check < "$file"
          done
