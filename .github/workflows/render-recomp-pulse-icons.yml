name: Render Recomp Pulse launcher icons
on:
  push:
    branches:
      - feature/recomp-pulse-launch-20261024
    paths:
      - 'icon.svg'
      - '.github/workflows/render-recomp-pulse-icons.yml'
permissions:
  contents: write
jobs:
  generate-launcher-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render PNG sizes from approved SVG
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          for size in (192,512):
              cairosvg.svg2png(url='icon.svg',write_to=f'icon-{size}.png',output_width=size,output_height=size)
          PY
      - name: Commit updated launcher assets to preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Render approved Recomp Pulse PNG launcher icons"
            git push
          fi
