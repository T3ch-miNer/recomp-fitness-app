name: Recomp v3.2 Journey preview APK

on:
  push:
    branches:
      - feature/v3-2-android-beta-20261031
    paths:
      - '.github/workflows/android-debug-apk.yml'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'android-src/**'
      - 'android-health-connect/**'
      - '*.js'
      - '*.css'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Android debug APK (no signing secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund
      - name: Bundle existing web application
        run: npm run build:android-web
      - name: Generate Android Gradle project
        run: |
          npx cap add android
          npx cap sync android
      - name: Add Android Health Connect and usage plugins
        run: python3 scripts/integrate-android-native.py
      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify side-by-side beta application ID
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.t3chminer.recomp.journey'"
      - name: Upload installable test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: recomp-v3-2-journey-preview-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
