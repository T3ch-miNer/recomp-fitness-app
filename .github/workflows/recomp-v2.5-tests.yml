name: Recomp v2.5 nutrition and planner tests
on:
  push:
    branches:
      - feature/v2.5-integrated-recipe-planning-20261019
      - feature/v2.5.3-original-cloud-style-dev-clerk-20261020
      - feature/v2.5.4-exercise-demonstrations-20261020
      - feature/v2.5.5-workout-back-inline-dialogs-20261020
      - feature/v2.5.6-fts-round-based-giant-sets-20261020
      - feature/v2.6-giant-set-final-release-20261020
      - feature/v2.7-private-ai-photo-meals-20261020
      - feature/v3-android-you-healthconnect-20261027
  pull_request:
    paths:
      - 'app.js'
      - 'fts-workouts.js'
      - 'fts-workouts-5-15.js'
      - 'fts-workouts-16-41.js'
      - 'exercise-guides.js'
      - 'exercise-videos.js'
      - 'exercise-demonstration.js'
      - 'exercise-demonstration.css'
      - 'workout-back.js'
      - 'confirmation-dialog.js'
      - 'workout-polish.css'
      - 'giant-sets.js'
      - 'custom-giant-sets.js'
      - 'giant-set-view.js'
      - 'giant-sets.css'
      - 'db.js'
      - 'food-db.js'
      - 'recipe-variations.js'
      - 'you-page.js'
      - 'you-page.css'
      - 'nutrition-v2.js'
      - 'photo-ai.js'
      - 'photo-scan-worker/**'
      - 'food-recognition-worker.js'
      - 'meal-planner.js'
      - 'health-connect.js'
      - 'first-run.js'
      - 'clerk-auth.js'
      - 'goal-draft.js'
      - 'settings-layout.css'
      - 'index.html'
      - 'sw.js'
      - 'recomp-boot.css'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'first-run.css'
      - 'recipe-estimates.js'
      - 'nav-capsule.css'
      - 'android-health-connect/**'
      - 'meal-planner.test.mjs'
      - 'tests/**'
      - '.github/workflows/recomp-v2.5-tests.yml'
permissions:
  contents: read
jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check ES module syntax
        run: |
          for file in goal-draft.js photo-ai.js photo-scan-worker/worker.js app.js giant-sets.js giant-set-view.js custom-giant-sets.js fts-workouts.js fts-workouts-5-15.js fts-workouts-16-41.js exercise-videos.js exercise-guides.js exercise-demonstration.js workout-back.js confirmation-dialog.js db.js food-db.js nutrition-v2.js food-recognition-worker.js meal-planner.js recipe-estimates.js recipe-variations.js you-page.js health-connect.js first-run.js clerk-auth.js cloud.js sw.js; do
            node --input-type=module --check < "$file"
          done
      - name: Test meal planner, recipe integration, barcodes and local storage
        run: node --test meal-planner.test.mjs tests/*.test.mjs
