name: Recomp v2.5 nutrition and planner tests
on:
  push:
    branches:
      - feature/v2.5-integrated-recipe-planning-20261019
      - feature/v2.5.3-original-cloud-style-dev-clerk-20261020
      - feature/v2.5.4-exercise-demonstrations-20261020
      - feature/v2.5.5-workout-back-inline-dialogs-20261020
      - feature/v2.5.6-fts-round-based-giant-sets-20261020
      - feature/v2.6-giant-set-finish-20261020
  pull_request:
    paths:
      - 'app.js'
      - 'fts-workouts.js'
      - 'exercise-guides.js'
      - 'exercise-demonstration.js'
      - 'exercise-demonstration.css'
      - 'workout-back.js'
      - 'confirmation-dialog.js'
      - 'workout-polish.css'
      - 'giant-sets.js'
      - 'giant-set-view.js'
      - 'giant-sets.css'
      - 'db.js'
      - 'food-db.js'
      - 'nutrition-v2.js'
      - 'food-recognition-worker.js'
      - 'meal-planner.js'
      - 'health-connect.js'
      - 'first-run.js'
      - 'clerk-auth.js'
      - 'nav-cloud.css'
      - 'first-run.css'
      - 'recipe-estimates.js'
      - 'nav-capsule.css'
      - 'android-health-connect/**'
      - 'meal-planner.test.mjs'
      - 'tests/**'
      - '.github/workflows/recomp-v2.5-tests.yml'
permissions:
  contents: read
jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check ES module syntax
        run: |
          for file in app.js giant-sets.js giant-set-view.js fts-workouts.js exercise-guides.js exercise-demonstration.js workout-back.js confirmation-dialog.js db.js food-db.js nutrition-v2.js food-recognition-worker.js meal-planner.js recipe-estimates.js health-connect.js first-run.js clerk-auth.js cloud.js sw.js; do
            node --input-type=module --check < "$file"
          done
      - name: Test meal planner, recipe integration, barcodes and local storage
        run: node --test meal-planner.test.mjs tests/*.test.mjs
